name: Android debug build

on:
  push:
    branches:
      - main
      - feat/subhuplay-android-foundation
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"

      # Use the same debug signing certificate on every CI run so Google
      # OAuth continues to recognize APKs produced by GitHub Actions.
      - name: Restore stable debug keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          if [[ -n "$DEBUG_KEYSTORE_BASE64" ]]; then
            mkdir -p "$HOME/.android"
            printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
            chmod 600 "$HOME/.android/debug.keystore"
            echo "Stable debug keystore restored."
          else
            echo "::warning::ANDROID_DEBUG_KEYSTORE_BASE64 is not configured; this APK will use a temporary CI debug certificate and Google sign-in may fail."
          fi

      - name: Build debug APK
        env:
          ORG_GRADLE_PROJECT_YOUTUBE_DATA_API_KEY: ${{ secrets.YOUTUBE_DATA_API_KEY }}
          ORG_GRADLE_PROJECT_GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Verify APK signing certificate
        shell: bash
        run: |
          CERT_INFO="$ANDROID_HOME/build-tools/37.0.0/apksigner verify --print-certs app/build/outputs/apk/debug/app-debug.apk"
          echo "$CERT_INFO"
          {
            echo "### APK signing certificate"
            echo '---'
            echo ' ```text'
            echo "$CERT_INFO"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: SubhuPlay-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
