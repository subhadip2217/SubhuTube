name: Android debug build

on:
  push:
    branches:
      - main
      - feat/subhuplay-android-foundation
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"

      # Use the same debug signing certificate on every CI run so Google
      # OAuth continues to recognize APKs produced by GitHub Actions.
      - name: Restore stable debug keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          if [[ -z "$DEBUG_KEYSTORE_BASE64" ]]; then
            echo "::error::Missing ANDROID_DEBUG_KEYSTORE_BASE64 repository secret."
            exit 1
          fi
          mkdir -p "$HOME/.android"
          printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
          test -s "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
          echo "Stable debug keystore restored."
      
      - name: Verify restored keystore fingerprint
        shell: bash
        run: |
          KEYSTORE_INFO=$(keytool -list -v -keystore "$HOME/.android/debug.keystore" -alias androiddebugkey -storepass android -keypass android)
          KEYSTORE_SHA1=$(printf '%s\n' "$KEYSTORE_INFO" | sed -n 's/^[[:space:]]*SHA1: //p' | head -n 1 | tr -d ':')
          if [[ -z "$KEYSTORE_SHA1" ]]; then
            echo "::error::Could not read SHA-1 from restored debug keystore."
            exit 1
          fi
          echo "Restored keystore SHA-1: $KEYSTORE_SHA1"
          {
            echo "### Restored debug keystore"
            echo "SHA-1: `$KEYSTORE_SHA1`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build debug APK
        env:
          ORG_GRADLE_PROJECT_YOUTUBE_DATA_API_KEY: ${{ secrets.YOUTUBE_DATA_API_KEY }}
          ORG_GRADLE_PROJECT_GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Verify APK signing certificate
        shell: bash
        run: |
          CERT_INFO=$("$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --print-certs app/build/outputs/apk/debug/app-debug.apk)
          echo "$CERT_INFO"
          KEYSTORE_SHA1=$(keytool -list -v -keystore "$HOME/.android/debug.keystore" -alias androiddebugkey -storepass android -keypass android | sed -n 's/^[[:space:]]*SHA1: //p' | head -n 1 | tr -d ':')
          APK_SHA1=$(printf '%s\n' "$CERT_INFO" | sed -n 's/.*certificate SHA-1 digest: //p' | head -n 1 | tr -d ':')
          echo "Restored keystore SHA-1: $KEYSTORE_SHA1"
          echo "APK signing SHA-1:       $APK_SHA1"
          if [[ -z "$KEYSTORE_SHA1" || -z "$APK_SHA1" || "${KEYSTORE_SHA1,,}" != "${APK_SHA1,,}" ]]; then
            echo "::error::APK signature does not match the restored debug keystore."
            exit 1
          fi
          {
            echo "### APK signing certificate"
            echo '---'
            echo ' ```text'
            echo "$CERT_INFO"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: SubhuPlay-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
